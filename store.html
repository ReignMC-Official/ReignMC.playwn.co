<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store — ReignMC</title>
<meta name="description" content="The ReignMC store is coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0a0710;
    --rift-purple: #6a2fb8;
    --gold: #e8b84c;
    --gold-pale: #f3d998;
    --parchment: #ece2cc;
    --parchment-dim: #a89a84;
    --line: rgba(232,184,76,0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--void);
    color: var(--parchment);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .bg-field {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 800px 600px at 50% 30%, rgba(106,47,184,0.30), transparent 60%),
      radial-gradient(ellipse 700px 500px at 80% 80%, rgba(232,184,76,0.08), transparent 55%),
      var(--void);
  }

  header {
    position: relative; z-index: 2;
    border-bottom: 1px solid var(--line);
  }
  nav {
    max-width: 1180px; margin: 0 auto; padding: 18px 28px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand {
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 1.25rem; letter-spacing: 0.06em;
    background: linear-gradient(120deg, var(--gold-pale), var(--gold) 40%, var(--rift-purple) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .nav-links { display: flex; gap: 32px; font-size: 0.92rem; color: var(--parchment-dim); }
  .nav-links a:hover { color: var(--gold-pale); }
  @media (max-width: 700px) { .nav-links { display: none; } }

  main {
    position: relative; z-index: 2;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 28px;
  }
  .coming-soon {
    max-width: 560px;
  }
  .glyph {
    width: 56px; height: 56px; margin: 0 auto 28px;
    border: 1px solid var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.4rem;
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(232,184,76,0.25); }
    50% { box-shadow: 0 0 0 12px rgba(232,184,76,0); }
  }
  .eyebrow {
    font-family: 'Cinzel', serif; font-size: 0.72rem; letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 20px; display: block;
  }
  h1 {
    font-family: 'Cinzel', serif; font-weight: 900; font-size: clamp(2rem, 6vw, 3rem);
    background: linear-gradient(100deg, var(--parchment) 0%, var(--gold-pale) 40%, var(--gold) 70%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 18px;
  }
  p.lede {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.2rem; color: var(--parchment-dim);
    margin-bottom: 36px;
  }
  .btn-secondary {
    display: inline-block;
    padding: 13px 28px;
    border: 1px solid var(--line);
    border-radius: 2px;
    font-size: 0.9rem; font-weight: 600; letter-spacing: 0.03em;
    transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }
  .btn-secondary:hover { border-color: var(--gold); color: var(--gold-pale); transform: translateY(-2px); }

  footer {
    position: relative; z-index: 2;
    border-top: 1px solid var(--line);
    padding: 30px 28px;
    text-align: center;
    font-size: 0.76rem;
    color: var(--parchment-dim);
    opacity: 0.7;
  }
</style>
</head>
<body>

<div class="bg-field"></div>

<header>
  <nav>
    <span class="brand">REIGNMC</span>
    <div class="nav-links">
      <a href="index.html#world">The World</a>
      <a href="index.html#features">Systems</a>
      <a href="index.html#lore">Lore</a>
      <a href="rules.html">Rules</a>
      <a href="store.html">Store</a>
      <a href="http://reignmc-map.playwn.co:5521" target="_blank" rel="noopener">Map</a>
    </div>
  </nav>
</header>

<main>
  <div class="coming-soon">
    <div class="glyph">◆</div>
    <span class="eyebrow">The Vault Is Sealed</span>
    <h1>Store Coming Soon</h1>
    <p class="lede">Reign Gems, premium tiers, and cosmetics are still being forged. Check back once the gates open.</p>
    <a class="btn-secondary" href="index.html">Back to Home</a>
  </div>
</main>

<footer>
  ReignMC is an independent community server and is not affiliated with Mojang or Microsoft.
</footer>

</body>
</html>
